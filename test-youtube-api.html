<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Gallery Video Check</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; line-height: 1.6; max-width: 50rem; }
        .result { margin-top: 1rem; padding: 0.75rem 1rem; border: 1px solid #ddd; border-radius: 6px; }
        .error { background-color: #ffebee; }
        .success { background-color: #e8f5e9; }
        code { background: #f5f5f5; padding: 0.1rem 0.3rem; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>Gallery Video Check</h1>
    <p>
        Lists what YouTube reports for each gallery video. This uses YouTube's public
        oEmbed endpoint, so it needs <strong>no API key</strong> and stores no secret.
        The build script <code>scripts/update-gallery.js</code> uses the same endpoint.
    </p>
    <div id="results">Checking&hellip;</div>

    <script>
        const videoIds = ['tR23ThTc6WM', 'KS9b1L6CTFg', '4UT1HEY-qXY', '4Y-x-DmvVns', 'XLjJunm0Nt8', 'EPgQzdHduNQ', 'M0ZA89ugxf0'];

        (async () => {
            const resultsDiv = document.getElementById('results');
            const rows = [];

            for (const id of videoIds) {
                const url = `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        rows.push(`<div class="result error"><strong>${id}</strong>: HTTP ${response.status} - video may be private or removed</div>`);
                        continue;
                    }
                    const data = await response.json();
                    rows.push(`<div class="result success"><strong>${id}</strong>: ${data.title} <em>[${data.author_name}]</em></div>`);
                } catch (error) {
                    rows.push(`<div class="result error"><strong>${id}</strong>: ${error.message}</div>`);
                }
            }

            resultsDiv.innerHTML = rows.join('');
        })();
    </script>
</body>
</html>
